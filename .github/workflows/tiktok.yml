name: tiktok
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tiktok
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U requests "https://github.com/yt-dlp/yt-dlp/archive/master.zip" 
      - run: sudo apt-get install -y ffmpeg
      - run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          git commit -m "update" || exit 0
          git pull --rebase -X theirs || (git rebase --abort; git fetch origin; git checkout origin/main -- state.json 2>/dev/null; git checkout -B main origin/main; python - <<'EOF'
          print("conflit ignore")
          EOF
          exit 0)
          git push || true
